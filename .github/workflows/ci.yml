name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java-tests:
    name: Java ${{ matrix.java }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test Java labs
        run: mvn --batch-mode test

  docs-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Validate source indexes, build, and check links
        run: npm run verify:docs
