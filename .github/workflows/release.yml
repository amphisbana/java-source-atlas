name: Release IDEA plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-plugin:
    name: Test, package, and publish IDEA plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      JETBRAINS_MARKETPLACE_CHANNEL: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test and package plugin
        working-directory: idea-plugin
        run: ./gradlew test ideaIntegrationTest verifyPlugin buildPlugin --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          plugin_zip="idea-plugin/build/distributions/java-source-atlas-idea-plugin-${GITHUB_REF_NAME#v}.zip"

          # 每个版本可以维护独立说明；未提供时使用 GitHub 自动生成的变更记录。
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" "$plugin_zip" \
              --verify-tag \
              --title "Java Source Atlas ${GITHUB_REF_NAME#v}" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" "$plugin_zip" \
              --verify-tag \
              --title "Java Source Atlas ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Publish JetBrains Marketplace
        if: ${{ env.JETBRAINS_MARKETPLACE_TOKEN != '' }}
        working-directory: idea-plugin
        run: ./gradlew publishPlugin --no-daemon
